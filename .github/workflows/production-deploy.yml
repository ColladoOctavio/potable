name: VPS production deploy

on:
  workflow_dispatch:

concurrency:
  group: vps-production-deploy
  cancel-in-progress: false

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: intl, mbstring, pdo_mysql, pdo_sqlite, sqlite3, zip
          coverage: none

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare Laravel environment
        run: |
          cp .env.example .env
          php artisan key:generate --no-interaction

      - name: Check PHP formatting
        run: ./vendor/bin/pint --test

      - name: Run tests
        run: php artisan test

      - name: Audit Composer dependencies
        run: composer audit

      - name: Audit production npm dependencies
        run: npm audit --omit=dev

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: test
    environment: production

    steps:
      - name: Configure SSH
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_SSH_KEY: ${{ secrets.PRODUCTION_SSH_KEY }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
        run: |
          set -Eeuo pipefail

          SSH_PORT="${PRODUCTION_SSH_PORT:-22}"

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$PRODUCTION_SSH_KEY" > ~/.ssh/potable_production_key
          chmod 600 ~/.ssh/potable_production_key

          ssh-keyscan -p "$SSH_PORT" -H "$PRODUCTION_HOST" >> ~/.ssh/known_hosts

      - name: Deploy on VPS
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
          PRODUCTION_USER: ${{ secrets.PRODUCTION_USER }}
          PRODUCTION_PATH: ${{ secrets.PRODUCTION_PATH }}
          PRODUCTION_SSH_PORT: ${{ secrets.PRODUCTION_SSH_PORT }}
        run: |
          set -Eeuo pipefail

          SSH_PORT="${PRODUCTION_SSH_PORT:-22}"
          printf -v PROJECT_PATH_QUOTED '%q' "$PRODUCTION_PATH"

          ssh \
            -i ~/.ssh/potable_production_key \
            -p "$SSH_PORT" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            "${PRODUCTION_USER}@${PRODUCTION_HOST}" \
            "cd $PROJECT_PATH_QUOTED && bash scripts/deploy-production.sh"
