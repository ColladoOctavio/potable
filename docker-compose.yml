services:
  mysql:
    image: mysql:8.4
    container_name: potable_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: potable_central
      MYSQL_USER: potable
      MYSQL_PASSWORD: secret
    ports:
      - "3307:3306"
    volumes:
      - potable_mysql_data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d

volumes:
  potable_mysql_data:
